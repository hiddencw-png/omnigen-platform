<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniGen - App & Game Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #050505; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Animations */
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
        
        /* Monaco Container */
        .monaco-editor-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Glassmorphism */
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-input { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-input:focus-within { border-color: rgba(59, 130, 246, 0.5); background: rgba(255, 255, 255, 0.05); }

        /* Loader */
        .cyber-loader {
            width: 100px;
            height: 100px;
            border: 3px solid transparent;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
        }
        .cyber-loader::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 3px solid transparent;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Individual Icon Components (Refactored to avoid dot-notation parsing bugs) ---
        const IconWand = (props) => <svg {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 4V2"></path><path d="M15 16v-2"></path><path d="M8 9h2"></path><path d="M20 9h2"></path><path d="M17.8 11.8 19 13"></path><path d="M15 9h0"></path><path d="M17.8 6.2 19 5"></path><path d="m3 21 9-9"></path><path d="M12.2 6.2 11 5"></path></svg>;
        const IconCode = (props) => <svg {...props} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>;
        const IconPlay = (props) => <svg {...props} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const IconCpu = (props) => <svg {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>;
        const IconArrowRight = (props) => <svg {...props} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
        const IconSend = (props) => <svg {...props} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;

        // --- Monaco Editor Component ---
        const MonacoEditor = ({ value, onChange }) => {
            const containerRef = useRef(null);
            const editorRef = useRef(null);
            
            useEffect(() => {
                let isMounted = true;
                const initMonaco = () => {
                    if (!isMounted || !containerRef.current || editorRef.current) return;
                    editorRef.current = window.monaco.editor.create(containerRef.current, {
                        value: value,
                        language: 'html',
                        theme: 'vs-dark',
                        automaticLayout: true,
                        minimap: { enabled: false },
                        fontSize: 14,
                        fontFamily: "'JetBrains Mono', 'Consolas', monospace",
                        padding: { top: 16 },
                        scrollBeyondLastLine: false,
                        wordWrap: 'on'
                    });
                    editorRef.current.onDidChangeModelContent(() => {
                        onChange(editorRef.current.getValue());
                    });
                };

                if (window.monaco) {
                    initMonaco();
                } else {
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js';
                    script.onload = () => {
                        window.require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
                        window.require(['vs/editor/editor.main'], () => {
                            if (isMounted) initMonaco();
                        });
                    };
                    document.body.appendChild(script);
                }

                return () => {
                    isMounted = false;
                    if (editorRef.current) editorRef.current.dispose();
                };
            }, []);

            useEffect(() => {
                if (editorRef.current) {
                    const model = editorRef.current.getModel();
                    if (model && value !== model.getValue()) {
                        editorRef.current.executeEdits('external', [{
                            range: model.getFullModelRange(),
                            text: value
                        }]);
                    }
                }
            }, [value]);

            return <div ref={containerRef} className="monaco-editor-container" />;
        };

        // --- API Integration ---
        const fetchWithRetry = async (url, options, maxRetries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response;
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        const generateAppCode = async (prompt, isRefinement = false, currentCode = "") => {
            const apiKey = ""; // Runtime populated
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const systemPrompt = `You are OmniGen, a legendary 10x full-stack developer AI.
The user will provide the name of a game, app, or website.
Your objective is to generate the COMPLETE, fully functional, production-ready source code for it in a SINGLE HTML file.
CRITICAL RULES:
1. Output ONLY a valid JSON object strictly conforming to this schema: { "code": "<complete_html_string>" }
2. The HTML MUST contain ALL CSS (Tailwind classes via CDN strongly preferred) and ALL JavaScript needed to make the app fully functional.
3. For Games: Include the game loop, canvas/DOM rendering, collision detection, score, and restart logic.
4. For Apps: Include interactive UI, state management, and mock functionality.
5. DO NOT wrap the JSON in markdown formatting (no \`\`\`json). Return raw JSON only.
6. DO NOT use placeholders like "logic goes here". Write the actual execution logic.
7. Ensure responsive design and a modern, polished aesthetic.`;

            let userPromptText = `Build this application/game fully functioning: ${prompt}`;
            if (isRefinement) {
                userPromptText = `Here is the current code state:\n\`\`\`html\n${currentCode}\n\`\`\`\n\nApply the following refinement/update to the code and return the FULL updated HTML file: ${prompt}`;
            }

            const payload = {
                contents: [{ role: "user", parts: [{ text: userPromptText }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            code: { type: "STRING", description: "The complete, standalone HTML code." }
                        },
                        required: ["code"]
                    }
                }
            };

            const response = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            let resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (!resultText) throw new Error("Invalid API response format");
            
            // Clean markdown wrappers if AI ignores schema directives
            resultText = resultText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '');
            
            const parsed = JSON.parse(resultText);
            return parsed.code;
        };

        // --- Main Application ---
        const App = () => {
            const [view, setView] = useState('landing'); // 'landing', 'generating', 'ide'
            const [prompt, setPrompt] = useState('');
            const [code, setCode] = useState('');
            const [activeTab, setActiveTab] = useState('preview'); // 'preview' or 'code'
            const [previewError, setPreviewError] = useState(null);
            const [refinementPrompt, setRefinementPrompt] = useState('');
            const [isRefining, setIsRefining] = useState(false);
            
            const inputRef = useRef(null);

            useEffect(() => {
                if (view === 'landing' && inputRef.current) {
                    inputRef.current.focus();
                }
            }, [view]);

            // Handle Preview Errors via postMessage from iframe
            useEffect(() => {
                const handleMessage = (e) => {
                    if (e.data && e.data.type === 'preview-error') {
                        setPreviewError(e.data.message);
                    }
                };
                window.addEventListener('message', handleMessage);
                return () => window.removeEventListener('message', handleMessage);
            }, []);

            const handleGenerate = async (e) => {
                if (e) e.preventDefault();
                const trimmed = prompt.trim();
                if (!trimmed) return;

                setView('generating');
                setPreviewError(null);

                try {
                    const generatedCode = await generateAppCode(trimmed);
                    setCode(generatedCode);
                    setView('ide');
                    setActiveTab('preview');
                } catch (error) {
                    console.error("Generation failed:", error);
                    alert(`Failed to generate application: ${error.message}`);
                    setView('landing');
                }
            };

            const handleRefine = async (e) => {
                if (e) e.preventDefault();
                const trimmed = refinementPrompt.trim();
                if (!trimmed || isRefining) return;

                setIsRefining(true);
                setPreviewError(null);

                try {
                    const updatedCode = await generateAppCode(trimmed, true, code);
                    setCode(updatedCode);
                    setRefinementPrompt('');
                    setActiveTab('preview');
                } catch (error) {
                    console.error("Refinement failed:", error);
                    alert(`Failed to refine application: ${error.message}`);
                } finally {
                    setIsRefining(false);
                }
            };

            // Prepare iframe srcDoc with error catching
            const previewSrcDoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <script>
                        window.onerror = function(msg, url, line) {
                            window.parent.postMessage({ type: 'preview-error', message: msg + ' (Line ' + line + ')' }, '*');
                            return false;
                        };
                    <\/script>
                </head>
                <body>
                    ${code}
                </body>
                </html>
            `;

            // --- Views ---
            if (view === 'landing') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#1e293b] via-[#050505] to-[#000000]">
                        
                        {/* Background Decor */}
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 blur-[120px] rounded-full mix-blend-screen pointer-events-none"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-indigo-600/20 blur-[100px] rounded-full mix-blend-screen pointer-events-none"></div>

                        <div className="z-10 flex flex-col items-center w-full max-w-3xl px-6 animate-float">
                            <div className="w-20 h-20 mb-8 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-[0_0_40px_rgba(59,130,246,0.5)]">
                                <IconCpu className="w-10 h-10 text-white" />
                            </div>
                            
                            <h1 className="text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-white text-center tracking-tight mb-4">
                                OmniGen Studio
                            </h1>
                            <p className="text-lg md:text-xl text-slate-400 mb-12 text-center max-w-2xl font-light">
                                Instantly generate full-stack source code. Type the name of a game, website, or utility app, and watch it materialize.
                            </p>

                            <form onSubmit={handleGenerate} className="w-full relative group">
                                <div className="absolute -inset-1 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
                                <div className="relative glass-input rounded-2xl flex items-center p-2 shadow-2xl">
                                    <div className="pl-4 pr-2 text-blue-400">
                                        <IconWand />
                                    </div>
                                    <input
                                        ref={inputRef}
                                        type="text"
                                        value={prompt}
                                        onChange={(e) => setPrompt(e.target.value)}
                                        placeholder="e.g. Flappy Bird clone, Scientific Calculator, Kanban Board..."
                                        className="w-full bg-transparent text-white text-lg px-2 py-4 focus:outline-none placeholder-slate-500"
                                        autoComplete="off"
                                    />
                                    <button
                                        type="submit"
                                        disabled={!prompt.trim()}
                                        className="bg-blue-600 hover:bg-blue-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-semibold py-3 px-6 rounded-xl ml-2 transition-all flex items-center gap-2 animate-pulse-glow"
                                    >
                                        Generate <IconArrowRight />
                                    </button>
                                </div>
                            </form>

                            <div className="mt-12 flex gap-4 text-sm text-slate-500">
                                <span className="cursor-pointer hover:text-blue-400 transition" onClick={() => setPrompt("Pacman Arcade Game")}>Try: Pacman</span> •
                                <span className="cursor-pointer hover:text-blue-400 transition" onClick={() => setPrompt("Netflix UI Clone")}>Try: Netflix Clone</span> •
                                <span className="cursor-pointer hover:text-blue-400 transition" onClick={() => setPrompt("Interactive Periodic Table")}>Try: Periodic Table</span>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'generating') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-[#050505]">
                        <div className="cyber-loader mb-8"></div>
                        <h2 className="text-2xl font-bold text-white mb-2">Synthesizing Source Code</h2>
                        <p className="text-blue-400 animate-pulse font-mono text-sm">Writing HTML, CSS, and Game Logic...</p>
                    </div>
                );
            }

            // IDE View
            return (
                <div className="flex flex-col h-screen w-screen bg-[#0f111a] overflow-hidden">
                    {/* Top Navigation Bar */}
                    <div className="h-14 glass-panel border-b border-[#1e293b] flex items-center justify-between px-6 z-20 shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
                                <IconCpu className="w-5 h-5 text-white" />
                            </div>
                            <span className="font-bold text-gray-200 tracking-wide">OmniGen Workspace</span>
                            <span className="text-xs px-2 py-1 bg-slate-800 rounded-md text-slate-400 border border-slate-700 ml-2 truncate max-w-[200px]">
                                {prompt}
                            </span>
                        </div>

                        <div className="flex items-center gap-2 bg-[#1e293b] p-1 rounded-lg border border-[#334155]">
                            <button
                                onClick={() => setActiveTab('preview')}
                                className={`flex items-center gap-2 px-4 py-1.5 rounded-md text-sm font-medium transition-all ${activeTab === 'preview' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-200'}`}
                            >
                                <IconPlay /> App Preview
                            </button>
                            <button
                                onClick={() => setActiveTab('code')}
                                className={`flex items-center gap-2 px-4 py-1.5 rounded-md text-sm font-medium transition-all ${activeTab === 'code' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-gray-200'}`}
                            >
                                <IconCode /> Source Code
                            </button>
                        </div>

                        <div className="flex items-center">
                            <button onClick={() => { setView('landing'); setPrompt(''); setCode(''); }} className="text-sm text-slate-400 hover:text-white transition">
                                ← New Project
                            </button>
                        </div>
                    </div>

                    {/* Main Workspace Area */}
                    <div className="flex-1 flex relative overflow-hidden">
                        
                        {/* Editor/Preview Container */}
                        <div className="flex-1 relative flex flex-col min-w-0">
                            
                            {/* Error Banner */}
                            {previewError && activeTab === 'preview' && (
                                <div className="absolute top-4 left-1/2 transform -translate-x-1/2 z-50 bg-red-900/90 text-red-200 px-4 py-2 rounded-lg border border-red-700 shadow-xl flex items-center gap-3 max-w-2xl backdrop-blur-sm">
                                    <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                                    <span className="text-sm font-mono truncate">{previewError}</span>
                                    <button onClick={() => setPreviewError(null)} className="ml-auto text-red-400 hover:text-white">✕</button>
                                </div>
                            )}

                            {/* Views */}
                            <div className="flex-1 relative">
                                {/* Code Editor */}
                                <div className={`absolute inset-0 ${activeTab === 'code' ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'}`}>
                                    <MonacoEditor value={code} onChange={setCode} />
                                </div>

                                {/* Live Preview */}
                                <div className={`absolute inset-0 bg-white ${activeTab === 'preview' ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'}`}>
                                    <iframe
                                        srcDoc={previewSrcDoc}
                                        className="w-full h-full border-none bg-white"
                                        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                                        title="App Preview"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Right Panel: Refinement Chat */}
                        <div className="w-[350px] border-l border-[#1e293b] bg-[#0b0d14] flex flex-col shrink-0 z-20 shadow-[-10px_0_30px_rgba(0,0,0,0.5)]">
                            <div className="h-12 border-b border-[#1e293b] flex items-center px-4">
                                <h3 className="text-sm font-semibold text-slate-300 flex items-center gap-2">
                                    <IconWand /> Modifier Tools
                                </h3>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-4 flex flex-col justify-end">
                                <div className="bg-[#1e293b] border border-[#334155] rounded-xl p-4 mb-4 text-sm text-slate-300">
                                    <p className="mb-2"><strong>App Generated Successfully!</strong></p>
                                    <p className="text-slate-400">Need changes? Ask OmniGen to refine the logic, fix a bug, or add a new feature below.</p>
                                </div>
                                
                                {isRefining && (
                                    <div className="bg-[#1e293b]/50 border border-blue-500/30 rounded-xl p-4 mb-4 text-sm text-blue-300 flex items-center gap-3">
                                        <div className="w-4 h-4 rounded-full border-2 border-blue-500 border-t-transparent animate-spin"></div>
                                        Rewriting source code...
                                    </div>
                                )}
                            </div>

                            <div className="p-4 border-t border-[#1e293b] bg-[#0f111a]">
                                <form onSubmit={handleRefine} className="relative">
                                    <textarea
                                        value={refinementPrompt}
                                        onChange={(e) => setRefinementPrompt(e.target.value)}
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleRefine(); }
                                        }}
                                        disabled={isRefining}
                                        placeholder="e.g. Add dark mode, make the snake move faster, fix layout..."
                                        className="w-full bg-[#1e293b] border border-[#334155] rounded-xl pl-3 pr-10 py-3 text-sm text-white focus:outline-none focus:border-blue-500 resize-none h-[100px]"
                                    />
                                    <button
                                        type="submit"
                                        disabled={!refinementPrompt.trim() || isRefining}
                                        className="absolute bottom-3 right-3 p-1.5 bg-blue-600 disabled:bg-slate-700 text-white rounded-lg hover:bg-blue-500 transition"
                                    >
                                        <IconSend />
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
